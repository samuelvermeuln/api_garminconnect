services:
  garmin-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: python-garminconnect-api:local
    container_name: garmin-api
    restart: unless-stopped
    command:
      - uvicorn
      - garmin_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${GARMIN_API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      GARMIN_API_ENCRYPTION_KEY: "${GARMIN_API_ENCRYPTION_KEY:?Set GARMIN_API_ENCRYPTION_KEY in .env}"
      GARMIN_API_ADMIN_KEY: "${GARMIN_API_ADMIN_KEY:-}"
      GARMIN_API_STORAGE: /data
      GARMIN_API_DATABASE: /data/garmin_api.sqlite3
      GARMIN_API_CACHE_TTL_SECONDS: "${GARMIN_API_CACHE_TTL_SECONDS:-120}"
    volumes:
      - ./your_data/garmin_api:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
